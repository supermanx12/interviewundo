name: Keep Render backend awake

on:
  schedule:
    # GitHub Actions schedules use UTC.
    # Runs every 10 minutes.
    - cron: "*/10 * * * *"

  # Allows you to test it manually from GitHub.
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          curl --fail \
            --silent \
            --show-error \
            --connect-timeout 60 \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            https://interviewundo.onrender.com/health